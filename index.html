<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

  <title>IRON FURY</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- GAME -->
  <canvas id="gameCanvas"></canvas>

  <!-- LOADING -->
  <div id="loadingScreen">
    <div class="loadingBox">
      <div class="logo">IRON FURY</div>
      <div id="loadingText">INITIALIZING</div>
      <div class="loadingBar">
        <div id="loadingProgress"></div>
      </div>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud">

    <div class="fighterHud playerHud">
      <div class="name">IRON FURY</div>

      <div class="bar healthBar">
        <div id="playerHealth"></div>
      </div>

      <span id="playerHealthText">100</span>

      <div class="bar vitalityBar">
        <div id="playerVitality"></div>
      </div>

      <span id="playerVitalityText">100</span>

      <div class="fury">
        <span id="fury1"></span>
        <span id="fury2"></span>
        <span id="fury3"></span>
      </div>

      <div id="playerFuryText">0 / 3</div>
    </div>


    <div class="centerHud">

      <div class="round">ROUND <span id="roundNumber">1</span></div>

      <div id="timer">60</div>

      <div id="comboCounter">
        <span id="comboNumber">0</span>
        <small>HIT COMBO</small>
      </div>

    </div>


    <div class="fighterHud enemyHud">
      <div class="name">RIVAL</div>

      <div class="bar healthBar">
        <div id="enemyHealth"></div>
      </div>

      <span id="enemyHealthText">100</span>

      <div class="bar vitalityBar">
        <div id="enemyVitality"></div>
      </div>

      <span id="enemyVitalityText">100</span>

      <div class="fury">
        <span id="enemyFury1"></span>
        <span id="enemyFury2"></span>
        <span id="enemyFury3"></span>
      </div>

      <div id="enemyFuryText">0 / 3</div>
    </div>

  </div>


  <!-- MESSAGES -->
  <div id="messageBox">
    <div id="message"></div>
    <div id="subMessage"></div>
  </div>

  <div id="damageFlash"></div>
  <div id="furyFlash"></div>

  <div id="damageNumber">0</div>


  <!-- PAUSE -->
  <button id="pauseButton">Ⅱ</button>

  <div id="pauseMenu" class="overlay hidden">
    <div class="menuBox">
      <h1>PAUSED</h1>
      <button id="resumeButton">RESUME</button>
      <button id="pauseRestartButton">RESTART</button>
    </div>
  </div>


  <!-- RESULT -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="menuBox">

      <h1 id="resultTitle">VICTORY</h1>

      <p id="resultDescription"></p>

      <div class="results">
        <div>MAX COMBO <b id="resultCombo">0</b></div>
        <div>DAMAGE <b id="resultDamage">0</b></div>
        <div>FURY <b id="resultFury">0</b></div>
      </div>

      <button id="restartButton">FIGHT AGAIN</button>

    </div>
  </div>


  <!-- FURY FINISH -->
  <div id="finishOverlay" class="overlay hidden">
    <div class="menuBox finishBox">
      <h1 id="finishTitle">FURY FINISH</h1>
      <p id="finishSubtitle">THE RIVAL HAS FALLEN</p>
      <button id="finishButton">FINISH</button>
    </div>
  </div>


  <!-- MOBILE CONTROLS -->
  <div id="mobileControls">

    <div id="joystick">
      <div id="joystickKnob"></div>
    </div>

    <div id="actionButtons">

      <button id="jumpButton" class="action jump">JUMP</button>
      <button id="dashButton" class="action dash">DASH</button>
      <button id="punchButton" class="action punch">P</button>
      <button id="kickButton" class="action kick">K</button>
      <button id="blockButton" class="action block">B</button>
      <button id="furyButton" class="action fury">FURY</button>

    </div>

  </div>


  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script src="game.js"></script>

</body>
</html>
