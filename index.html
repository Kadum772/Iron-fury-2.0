Iron Fury — index.html

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#05080c">

  <title>Iron Fury 3D</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOADING -->
  <div id="loadingScreen" class="overlay">
    <div class="loader-card">
      <div class="logo">IRON FURY</div>

      <div id="loadingText">
        INITIALIZING ENGINE
      </div>

      <div class="progress">
        <div id="loadingProgress"></div>
      </div>
    </div>
  </div>


  <!-- 3D GAME -->
  <canvas id="gameCanvas"></canvas>


  <!-- HUD -->
  <div id="hud">

    <!-- PLAYER -->
    <div class="fighter-hud player-hud">

      <div class="name-row">
        <span>IRON FURY</span>
        <span id="playerHealthText">100</span>
      </div>

      <div class="bar health">
        <div id="playerHealth"></div>
      </div>

      <div class="bar vitality">
        <div id="playerVitality"></div>
      </div>

      <div class="fury-row">
        <span>FURY</span>

        <div class="fury-slots">
          <i id="fury1"></i>
          <i id="fury2"></i>
          <i id="fury3"></i>
        </div>

        <span id="playerFuryText">
          0 / 3
        </span>
      </div>

    </div>


    <!-- CENTER -->
    <div class="center-hud">

      <div class="round">
        ROUND <span id="roundNumber">1</span>
      </div>

      <div id="timer">
        60
      </div>

    </div>


    <!-- ENEMY -->
    <div class="fighter-hud enemy-hud">

      <div class="name-row">
        <span>RIVAL</span>
        <span id="enemyHealthText">100</span>
      </div>

      <div class="bar health">
        <div id="enemyHealth"></div>
      </div>

      <div class="bar vitality">
        <div id="enemyVitality"></div>
      </div>

      <div class="fury-row">

        <span id="enemyFuryText">
          0 / 3
        </span>

        <div class="fury-slots">
          <i id="enemyFury1"></i>
          <i id="enemyFury2"></i>
          <i id="enemyFury3"></i>
        </div>

        <span>FURY</span>

      </div>

    </div>

  </div>


  <!-- PAUSE -->
  <button id="pauseButton" class="pause-button">
    Ⅱ
  </button>


  <!-- FIGHT MESSAGE -->
  <div id="message" class="fight-message"></div>
  <div id="subMessage" class="fight-submessage"></div>


  <!-- COMBO -->
  <div id="comboCounter" class="combo-counter">
    <strong id="comboNumber">0</strong>
    <span>HIT COMBO</span>
  </div>


  <!-- DAMAGE -->
  <div id="damageNumber" class="damage-number">
    0
  </div>


  <div id="damageFlash" class="flash"></div>
  <div id="furyFlash" class="fury-flash"></div>


  <!-- MOBILE CONTROLS -->
  <div id="controls">

    <div id="joystick" class="joystick">
      <div id="joystickKnob" class="joystick-knob"></div>
    </div>


    <div class="action-buttons">

      <button id="jumpButton" class="control jump">
        JUMP
      </button>

      <button id="dashButton" class="control dash">
        DASH
      </button>

      <button id="punchButton" class="control punch">
        PUNCH
      </button>

      <button id="kickButton" class="control kick">
        KICK
      </button>

      <button id="blockButton" class="control block">
        BLOCK
      </button>

      <button id="furyButton" class="control fury">
        FURY
      </button>

    </div>

  </div>


  <!-- PAUSE MENU -->
  <div id="pauseMenu" class="menu-overlay hidden">

    <div class="menu-card">

      <h1>PAUSED</h1>

      <button id="resumeButton">
        RESUME
      </button>

      <button id="pauseRestartButton">
        RESTART
      </button>

    </div>

  </div>


  <!-- RESULT -->
  <div id="resultOverlay" class="menu-overlay hidden">

    <div class="menu-card">

      <h1 id="resultTitle">
        VICTORY
      </h1>

      <p id="resultDescription"></p>

      <div class="stats">

        <div>
          <b id="resultCombo">0</b>
          <span>MAX COMBO</span>
        </div>

        <div>
          <b id="resultDamage">0</b>
          <span>DAMAGE</span>
        </div>

        <div>
          <b id="resultFury">0</b>
          <span>FURY USED</span>
        </div>

      </div>

      <button id="restartButton">
        FIGHT AGAIN
      </button>

    </div>

  </div>


  <!-- FURY FINISH -->
  <div id="finishOverlay" class="menu-overlay hidden">

    <div class="menu-card finish-card">

      <h1 id="finishTitle">
        FURY FINISH
      </h1>

      <p id="finishSubtitle">
        THE RIVAL HAS FALLEN
      </p>

      <button id="finishButton">
        FINISH
      </button>

    </div>

  </div>


  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- GAME -->
  <script src="game.js"></script>

</body>
</html>
