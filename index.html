<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Iron Fury</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- HUD -->
  <div id="hud">

    <div class="hud-side player-hud">
      <div class="name">IRON FURY</div>

      <div class="health">
        <div id="player-health"></div>
      </div>

      <div class="fury">
        <span id="fury1"></span>
        <span id="fury2"></span>
        <span id="fury3"></span>
      </div>
    </div>

    <div id="timer">60</div>

    <div class="hud-side enemy-hud">
      <div class="name">RIVAL</div>

      <div class="health">
        <div id="enemy-health"></div>
      </div>

      <div class="fury enemy-fury">
        <span id="enemy-fury1"></span>
        <span id="enemy-fury2"></span>
        <span id="enemy-fury3"></span>
      </div>
    </div>

  </div>


  <!-- ARENA -->
  <div id="arena">

    <div class="light"></div>

    <div class="floor">
      <div class="grid"></div>
    </div>


    <!-- PLAYER -->
    <div id="player" class="fighter player">

      <div class="shadow"></div>

      <div class="head">
        <div class="eye"></div>
      </div>

      <div class="body">
        <div class="core"></div>
      </div>

      <div class="arm arm-left">
        <div class="hand"></div>
      </div>

      <div class="arm arm-right">
        <div class="hand"></div>
      </div>

      <div class="leg leg-left">
        <div class="foot"></div>
      </div>

      <div class="leg leg-right">
        <div class="foot"></div>
      </div>

    </div>


    <!-- ENEMY -->
    <div id="enemy" class="fighter enemy">

      <div class="shadow"></div>

      <div class="head">
        <div class="eye"></div>
      </div>

      <div class="body">
        <div class="core"></div>
      </div>

      <div class="arm arm-left">
        <div class="hand"></div>
      </div>

      <div class="arm arm-right">
        <div class="hand"></div>
      </div>

      <div class="leg leg-left">
        <div class="foot"></div>
      </div>

      <div class="leg leg-right">
        <div class="foot"></div>
      </div>

    </div>

    <div id="message"></div>

  </div>


  <!-- CONTROLS -->
  <div id="controls">

    <div id="joystick">
      <div id="joystick-knob"></div>
    </div>

    <div id="buttons">

      <button id="special" class="action special">FURY</button>
      <button id="jump" class="action jump">↑</button>
      <button id="dash" class="action dash">»</button>

      <button id="punch" class="action punch">P</button>
      <button id="kick" class="action kick">K</button>
      <button id="block" class="action block">B</button>

    </div>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
